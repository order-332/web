<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>#332</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/grave.css">
<script src="main.js" defer></script>
</head>
<body>
<main class="chat" aria-label="chat">
  <header class="bar">
    <h1>#332</h1>
    <p id="status" role="status"></p>
  </header>
  <div class="talk">
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <form class="say" id="say">
      <img class="hand" src="img/hand.svg" alt="">
      <label class="sr" for="text">message</label>
      <input id="text" maxlength="280" autocomplete="off" spellcheck="false" enterkeyhint="send">
      <button type="submit">send</button>
    </form>
  </div>
  <aside class="people" aria-label="in this room">
    <img class="crest" src="../shared/logo-1bit-bone.png" alt="the 332 logo" width="420" height="420">
    <h2>here <span id="count">0</span></h2>
    <ul id="members"></ul>
  </aside>
</main>
<noscript><p>332 is a crew, a handle, a zine and a project. all at once.</p></noscript>
</body>
</html>
